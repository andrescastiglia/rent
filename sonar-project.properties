sonar.projectKey=andrescastiglia_rent
sonar.projectName=Real Estate Management System
sonar.projectVersion=1.1.0
sonar.organization=andrescastiglia-rent
sonar.sourceEncoding=UTF-8

# One project preserves cross-module duplication checks and coverage paths.
sonar.sources=backend/src,frontend/src,batch/src,mobile/src,mobile/app,shared
sonar.tests=backend/src,backend/test,frontend/src,frontend/e2e,batch/src,mobile/src,mobile/app,shared
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.e2e-spec.ts,**/*.spec.cjs
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,frontend/src/generated/**,mobile/src/generated/**,shared/jest.config.cjs,**/*.d.ts,**/*.d.cts
# The OpenAPI generator runs during builds; application code stays in coverage.
sonar.coverage.exclusions=backend/src/openapi/**
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,backend/coverage/e2e/lcov.info,backend/coverage/shared/lcov.info,frontend/coverage/lcov.info,batch/coverage/lcov.info,mobile/coverage/lcov.info
sonar.typescript.tsconfigPaths=backend/tsconfig.json,frontend/tsconfig.json,batch/tsconfig.json,mobile/tsconfig.json
