name: Batch operations

on:
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        required: true
        type: choice
        options:
          - billing
          - overdue
          - reminders
          - lease-renewal-alerts
          - sync-indices
          - sync-rates
          - reports
          - process-settlements
      dry_run:
        description: Run without persistent side effects
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-batch-${{ inputs.job }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize production operation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-ops
    steps:
      - run: echo 'Production operation authorized.'
  run:
    name: Run ${{ inputs.job }} with deployed image
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment: production-release
    steps:
      - name: Configure SSH trust
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Create allowlisted Kubernetes Job
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          JOB: ${{ inputs.job }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          case "$JOB" in
            billing|overdue|reminders|lease-renewal-alerts|sync-indices|sync-rates|reports|process-settlements) ;;
            *) exit 2 ;;
          esac
          case "$DRY_RUN" in true|false) ;; *) exit 2 ;; esac
          job_name="$(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "sudo -n python3 /opt/rent-kubernetes/current/scripts/k8s/manual-job.py '$JOB' '$DRY_RUN'")"
          [[ "$job_name" =~ ^[a-z-]+-manual-[0-9]+$ ]]
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "sudo -n k3s kubectl -n rent wait --for=condition=complete job/$job_name --timeout=3600s"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
