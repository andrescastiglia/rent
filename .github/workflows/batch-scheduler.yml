name: Batch operations

on:
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        required: true
        type: choice
        options:
          - billing
          - overdue
          - reminders
          - lease-renewal-alerts
          - sync-indices
          - sync-rates
          - reports
          - process-settlements
      dry_run:
        description: Run without persistent side effects
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-batch-${{ inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    name: Run ${{ inputs.job }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-ops
    steps:
      - name: Checkout main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: batch/package-lock.json

      - name: Install dependencies
        working-directory: batch
        run: npm ci

      - name: Build once
        working-directory: batch
        run: npm run build

      - name: Run allowlisted command
        working-directory: batch
        env:
          JOB: ${{ inputs.job }}
          DRY_RUN: ${{ inputs.dry_run }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WHATSAPP_API_URL: ${{ secrets.WHATSAPP_API_URL }}
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          NODE_ENV: production
        run: |
          set -euo pipefail

          case "$JOB" in
            billing|overdue|reminders|lease-renewal-alerts|sync-indices|sync-rates|reports|process-settlements) ;;
            *)
              echo "Unsupported batch job: $JOB" >&2
              exit 1
              ;;
          esac

          args=("$JOB")
          if [ "$DRY_RUN" = true ]; then
            args+=(--dry-run)
          fi

          node dist/index.js "${args[@]}"
