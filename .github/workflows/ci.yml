name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22.22.1"

jobs:
  postgres-image-security:
    name: PostgreSQL image security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build pinned PostgreSQL image
        run: docker build --pull --tag rent-postgres:ci docker/postgres

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rent-postgres:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  # ─────────────────────────────────────────────────────────────
  # CODEQL SECURITY ANALYSIS
  # ─────────────────────────────────────────────────────────────
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # ─────────────────────────────────────────────────────────────
  # BACKEND JOBS
  # ─────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-backend-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:check

      - name: Type check
        run: npm run type-check

      - name: Format check
        run: npm run format:check

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d rent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      #redis:
      #  image: redis:7
      #  ports:
      #    - 6379:6379
      #  options: >-
      #    --health-cmd "redis-cli ping"
      #    --health-interval 10s
      #    --health-timeout 5s
      #    --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-backend-

      - name: Install dependencies
        run: npm ci

      # Coverage runs the complete Jest suite; a separate `npm test` here would
      # execute every backend test twice without adding a gate.
      - name: Run unit tests with coverage
        run: npm run test:cov
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rent_test
          #REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          NODE_ENV: test

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 1

  backend-e2e:
    name: Backend E2E
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d rent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-backend-

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          grep -rl "packages.microsoft.com" /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install pinned pgvector in PostgreSQL service
        working-directory: ${{ github.workspace }}
        run: bash scripts/install-pgvector-in-container.sh '${{ job.services.postgres.id }}'

      - name: Initialize database snapshot for E2E
        working-directory: ${{ github.workspace }}
        run: psql -h localhost -p 5432 -U test -d rent_test -f scripts/init-db.sql
        env:
          PGPASSWORD: test

      - name: Baseline snapshot and apply pending migrations
        working-directory: ${{ github.workspace }}
        run: >-
          bash migrations/run-migrations.sh
          --baseline-through 090_add_ai_rag_shadow_comparisons.sql
          --force-baseline-through
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rent_test

      - name: Verify RAG migration and transactional retirement
        working-directory: ${{ github.workspace }}
        run: psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U test -d rent_test -f scripts/verify-rag-migration.sql
        env:
          PGPASSWORD: test

      - name: Run backend E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rent_test
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          NODE_ENV: test

  sonarqube:
    name: SonarQube Analysis
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    needs: [backend-test, batch-test, frontend-test, mobile-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download backend coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Download batch coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: batch-coverage
          path: batch/coverage

      - name: Download frontend coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Download mobile coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: mobile-coverage
          path: mobile/coverage

      - name: Download Playwright Sonar report
        uses: actions/download-artifact@v8
        with:
          name: playwright-sonar-report
          path: frontend/playwright-report/playwright-sonar-report.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ─────────────────────────────────────────────────────────────
  # BATCH JOBS
  # ─────────────────────────────────────────────────────────────
  batch-lint:
    name: Batch Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: batch

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-batch-${{ hashFiles('batch/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-batch-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:check

      - name: Type check
        run: npm run type-check

      - name: Format check
        run: npm run format:check

  batch-test:
    name: Batch Tests
    runs-on: ubuntu-latest
    needs: batch-lint
    defaults:
      run:
        working-directory: batch

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-batch-${{ hashFiles('batch/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-batch-

      - name: Install dependencies
        run: npm ci

      # Coverage already executes the complete Jest suite.
      - name: Run unit tests with coverage
        run: npm run test:cov
        env:
          NODE_ENV: test

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: batch-coverage
          path: batch/coverage
          retention-days: 1

  batch-e2e:
    name: Batch E2E
    runs-on: ubuntu-latest
    needs: batch-lint

    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d rent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-bank-e2e-${{ hashFiles('batch/package-lock.json', 'backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-bank-e2e-

      - name: Install batch dependencies
        working-directory: batch
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          grep -rl "packages.microsoft.com" /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install pinned pgvector in PostgreSQL service
        run: bash scripts/install-pgvector-in-container.sh '${{ job.services.postgres.id }}'

      - name: Initialize database snapshot for E2E
        run: psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U test -d rent_test -f scripts/init-db.sql
        env:
          PGPASSWORD: test

      - name: Baseline migrations
        run: >-
          bash migrations/run-migrations.sh
          --baseline-through 094_add_bank_reconciliation_alerts_and_batch_job.sql
          --force-baseline-through
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rent_test

      - name: Run batch E2E commands (dry-run)
        working-directory: batch
        run: |
          npm run dev -- billing --dry-run
          npm run dev -- overdue --dry-run
          npm run dev -- lease-renewal-alerts --dry-run
          npm run dev -- reconcile-bank --dry-run --min-age-minutes 0
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rent_test
          NODE_ENV: test

      - name: Run settlement integration flow
        working-directory: batch
        run: |
          SETTLEMENT_PERIOD="$(date +%Y-%m)"
          npm run dev -- process-settlements \
            --owner-id 33333333-3333-3333-3333-333333333333 \
            --period "$SETTLEMENT_PERIOD"
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $assert$
          DECLARE
            settlement_record settlements%ROWTYPE;
          BEGIN
            SELECT * INTO settlement_record
            FROM settlements
            WHERE owner_id = '33333333-3333-3333-3333-333333333333'::uuid
              AND period = TO_CHAR(CURRENT_DATE, 'YYYY-MM');

            IF NOT FOUND THEN
              RAISE EXCEPTION 'Settlement was not persisted';
            END IF;
            IF settlement_record.status <> 'completed' THEN
              RAISE EXCEPTION 'Unexpected settlement status: %', settlement_record.status;
            END IF;
            IF settlement_record.gross_amount <> 250000.00 THEN
              RAISE EXCEPTION 'Unexpected gross amount: %', settlement_record.gross_amount;
            END IF;
            IF settlement_record.commission_amount <> 20000.00 THEN
              RAISE EXCEPTION 'Unexpected commission: %', settlement_record.commission_amount;
            END IF;
            IF settlement_record.net_amount <> 230000.00 THEN
              RAISE EXCEPTION 'Unexpected net amount: %', settlement_record.net_amount;
            END IF;
            IF settlement_record.transfer_reference IS NULL THEN
              RAISE EXCEPTION 'Transfer reference was not recorded';
            END IF;
          END
          $assert$;
          SQL
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rent_test
          NODE_ENV: test

      - name: Seed bank reconciliation integration fixture
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          INSERT INTO invoices (
            id, company_id, lease_id, owner_id, tenant_account_id,
            invoice_number, status, issue_date, due_date, period_start,
            period_end, subtotal, total_amount, balance_due, currency
          ) VALUES (
            'cccccccc-cccc-cccc-cccc-cccccccccccc',
            '11111111-1111-1111-1111-111111111111',
            '88888888-8888-8888-8888-888888888888',
            '33333333-3333-3333-3333-333333333333',
            '99999999-9999-9999-9999-999999999999',
            'INV-BANK-E2E', 'pending', CURRENT_DATE, CURRENT_DATE,
            DATE_TRUNC('month', CURRENT_DATE)::date,
            (DATE_TRUNC('month', CURRENT_DATE) + INTERVAL '1 month - 1 day')::date,
            43210.00, 43210.00, 43210.00, 'ARS'
          );

          UPDATE tenant_accounts
             SET current_balance = 43210.00
           WHERE id = '99999999-9999-9999-9999-999999999999';

          INSERT INTO bank_movements (
            id, company_id, provider, external_id, direction, amount,
            currency, occurred_at, description, raw_payload, status
          ) VALUES (
            'dddddddd-dddd-dddd-dddd-dddddddddddd',
            '11111111-1111-1111-1111-111111111111',
            'ci-bank', 'ci-bank-credit-1', 'credit', 43210.00,
            'ARS', NOW() - INTERVAL '10 minutes',
            'Batch reconciliation integration fixture', '{}'::jsonb, 'pending'
          );

          INSERT INTO bank_movements (
            id, company_id, provider, external_id, direction, amount,
            currency, occurred_at, description, raw_payload, status
          ) VALUES (
            'eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee',
            '11111111-1111-1111-1111-111111111111',
            'ci-bank', 'ci-bank-unmatched-1', 'credit', 98765.00,
            'ARS', NOW() - INTERVAL '10 minutes',
            'Unmatched reconciliation integration fixture', '{}'::jsonb, 'pending'
          );
          SQL
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rent_test

      - name: Start backend for bank reconciliation
        working-directory: backend
        run: |
          npm run start > "$RUNNER_TEMP/rent-backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/rent-backend.pid"
          for _ in $(seq 1 45); do
            if curl --fail --silent http://localhost:3001/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/rent-backend.log"
          exit 1
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rent_test
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          BATCH_BANK_RECONCILIATION_INTERNAL_TOKEN: ci-bank-token
          NODE_ENV: test

      - name: Run bank reconciliation integration flow
        working-directory: batch
        run: >-
          npm run dev -- reconcile-bank
          --company-id 11111111-1111-1111-1111-111111111111
          --limit 10
          --min-age-minutes 0
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rent_test
          BACKEND_INTERNAL_URL: http://localhost:3001
          BATCH_BANK_RECONCILIATION_INTERNAL_TOKEN: ci-bank-token
          NODE_ENV: test

      - name: Verify bank reconciliation integration flow
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $assert$
          DECLARE
            movement_status TEXT;
            reconciliation_status TEXT;
            invoice_status TEXT;
            payment_count INTEGER;
            alert_count INTEGER;
            job_status TEXT;
            unmatched_movement_status TEXT;
            unmatched_reconciliation_status TEXT;
            unmatched_alert_status TEXT;
          BEGIN
            SELECT status INTO movement_status
              FROM bank_movements
             WHERE id = 'dddddddd-dddd-dddd-dddd-dddddddddddd';
            SELECT status INTO reconciliation_status
              FROM bank_reconciliations
             WHERE movement_id = 'dddddddd-dddd-dddd-dddd-dddddddddddd';
            SELECT status INTO invoice_status
              FROM invoices
             WHERE id = 'cccccccc-cccc-cccc-cccc-cccccccccccc';
            SELECT COUNT(*) INTO payment_count
              FROM payments
             WHERE reference_number = 'ci-bank:ci-bank-credit-1'
               AND status = 'completed';
            SELECT COUNT(*) INTO alert_count
              FROM bank_reconciliation_alerts
             WHERE movement_id = 'dddddddd-dddd-dddd-dddd-dddddddddddd'
               AND status = 'open';
            SELECT status INTO job_status
              FROM billing_jobs
             WHERE job_type = 'reconcile_bank'
             ORDER BY created_at DESC
             LIMIT 1;
            SELECT status INTO unmatched_movement_status
              FROM bank_movements
             WHERE id = 'eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee';
            SELECT status INTO unmatched_reconciliation_status
              FROM bank_reconciliations
             WHERE movement_id = 'eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee';
            SELECT status INTO unmatched_alert_status
              FROM bank_reconciliation_alerts
             WHERE movement_id = 'eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee';

            IF movement_status <> 'reconciled'
              OR reconciliation_status <> 'matched'
              OR invoice_status <> 'paid'
              OR payment_count <> 1
              OR alert_count <> 0
              OR job_status <> 'completed'
              OR unmatched_movement_status <> 'unmatched'
              OR unmatched_reconciliation_status <> 'unmatched'
              OR unmatched_alert_status <> 'open' THEN
              RAISE EXCEPTION
                'Unexpected reconciliation state: movement %, reconciliation %, invoice %, payments %, alerts %, job %, unmatched movement %, unmatched reconciliation %, unmatched alert %',
                movement_status, reconciliation_status, invoice_status,
                payment_count, alert_count, job_status,
                unmatched_movement_status, unmatched_reconciliation_status,
                unmatched_alert_status;
            END IF;
          END $assert$;
          SQL
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rent_test

      - name: Seed invoice for unmatched reconciliation retry
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          INSERT INTO invoices (
            id, company_id, lease_id, owner_id, tenant_account_id,
            invoice_number, status, issue_date, due_date, period_start,
            period_end, subtotal, total_amount, balance_due, currency
          ) VALUES (
            'ffffffff-ffff-ffff-ffff-ffffffffffff',
            '11111111-1111-1111-1111-111111111111',
            '88888888-8888-8888-8888-888888888888',
            '33333333-3333-3333-3333-333333333333',
            '99999999-9999-9999-9999-999999999999',
            'INV-BANK-RETRY-E2E', 'pending', CURRENT_DATE, CURRENT_DATE,
            DATE_TRUNC('month', CURRENT_DATE)::date,
            (DATE_TRUNC('month', CURRENT_DATE) + INTERVAL '1 month - 1 day')::date,
            98765.00, 98765.00, 98765.00, 'ARS'
          );

          UPDATE tenant_accounts
             SET current_balance = 98765.00
           WHERE id = '99999999-9999-9999-9999-999999999999';
          SQL
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rent_test

      - name: Retry unmatched bank reconciliation
        working-directory: batch
        run: >-
          npm run dev -- reconcile-bank
          --company-id 11111111-1111-1111-1111-111111111111
          --limit 10
          --min-age-minutes 0
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rent_test
          BACKEND_INTERNAL_URL: http://localhost:3001
          BATCH_BANK_RECONCILIATION_INTERNAL_TOKEN: ci-bank-token
          NODE_ENV: test

      - name: Verify unmatched alert resolution
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $assert$
          DECLARE
            movement_status TEXT;
            reconciliation_status TEXT;
            invoice_status TEXT;
            alert_status TEXT;
            alert_resolved BOOLEAN;
            payment_count INTEGER;
          BEGIN
            SELECT status INTO movement_status
              FROM bank_movements
             WHERE id = 'eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee';
            SELECT status INTO reconciliation_status
              FROM bank_reconciliations
             WHERE movement_id = 'eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee';
            SELECT status INTO invoice_status
              FROM invoices
             WHERE id = 'ffffffff-ffff-ffff-ffff-ffffffffffff';
            SELECT status, resolved_at IS NOT NULL
              INTO alert_status, alert_resolved
              FROM bank_reconciliation_alerts
             WHERE movement_id = 'eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee';
            SELECT COUNT(*) INTO payment_count
              FROM payments
             WHERE reference_number = 'ci-bank:ci-bank-unmatched-1'
               AND status = 'completed';

            IF movement_status <> 'reconciled'
              OR reconciliation_status <> 'matched'
              OR invoice_status <> 'paid'
              OR alert_status <> 'resolved'
              OR alert_resolved IS NOT TRUE
              OR payment_count <> 1 THEN
              RAISE EXCEPTION
                'Unexpected retry state: movement %, reconciliation %, invoice %, alert %, resolved %, payments %',
                movement_status, reconciliation_status, invoice_status,
                alert_status, alert_resolved, payment_count;
            END IF;
          END $assert$;
          SQL
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rent_test

      - name: Stop bank reconciliation backend
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/rent-backend.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/rent-backend.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/rent-backend.log" ]; then
            tail -100 "$RUNNER_TEMP/rent-backend.log"
          fi

  # ─────────────────────────────────────────────────────────────
  # FRONTEND JOBS
  # ─────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-frontend-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:check

      - name: Type check
        run: npm run type-check

      - name: Format check
        run: npm run format:check

  # ─────────────────────────────────────────────────────────────
  # FRONTEND TESTS (Frontend only - uses mock data)
  # ─────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    needs: frontend-lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-frontend-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**', 'frontend/messages/**', 'frontend/next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Run frontend unit tests with coverage
        working-directory: frontend
        run: npm run test:cov
        env:
          NODE_ENV: test

      - name: Get Playwright version
        id: playwright-version
        working-directory: frontend
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_MOCK_MODE: "true"

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: true
          NEXT_PUBLIC_MOCK_MODE: "true"
          PLAYWRIGHT_USE_PRODUCTION_SERVER: "true"
          PLAYWRIGHT_WORKERS: "4"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload Playwright report to SonarQube
        uses: actions/upload-artifact@v7
        with:
          name: playwright-sonar-report
          path: frontend/playwright-report/playwright-sonar-report.xml

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # MOBILE JOBS
  # ─────────────────────────────────────────────────────────────
  mobile-lint:
    name: Mobile Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-mobile-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-mobile-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:check

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

  mobile-test:
    name: Mobile Tests
    runs-on: ubuntu-latest
    needs: mobile-lint
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-mobile-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-mobile-

      - name: Install dependencies
        run: npm ci

      - name: Run mobile unit tests with coverage
        run: npm run test:cov
        env:
          NODE_ENV: test

      - name: Upload mobile coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: mobile/coverage
          retention-days: 1

  mobile-e2e:
    name: Mobile E2E (Detox)
    runs-on: ubuntu-latest
    needs: mobile-lint
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-mobile-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-mobile-

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npm run e2e:prebuild

      - name: Setup Java with Gradle cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/gradle.properties

      - name: Install Android emulator system libraries
        run: |
          grep -rl "packages.microsoft.com" /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run mobile E2E tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DETOX_CONFIGURATION: android.emu.debug
          DETOX_ARTIFACTS: ../mobile-detox-artifacts
          LOGCAT_LOG: ../rent-e2e-logcat.log
          METRO_LOG: ../rent-metro-e2e.log
        with:
          api-level: 34
          avd-name: Medium_Phone_API_34
          arch: x86_64
          cores: 4
          profile: pixel_7
          disable-animations: true
          script: cd mobile && npm run e2e:android

      - name: Upload Detox artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-detox-artifacts
          path: |
            mobile-detox-artifacts
            rent-metro-e2e.log
            rent-e2e-logcat.log
          if-no-files-found: ignore
