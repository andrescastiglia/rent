name: Mobile native validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.22.1"

jobs:
  native-quality:
    name: Mobile native prerequisites
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-mobile-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-mobile-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:check

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

  mobile-ios:
    name: Mobile E2E (iOS)
    needs: native-quality
    uses: ./.github/workflows/mobile-ios.yml

  mobile-e2e:
    name: Mobile E2E (Detox)
    runs-on: ubuntu-latest
    needs: native-quality
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-mobile-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-mobile-

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npm run e2e:prebuild

      - name: Setup Java with Gradle cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/gradle.properties

      - name: Install Android emulator system libraries
        run: |
          grep -rl "packages.microsoft.com" /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run mobile E2E tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DETOX_CONFIGURATION: android.emu.debug
          DETOX_ARTIFACTS: ../mobile-detox-artifacts
          LOGCAT_LOG: ../rent-e2e-logcat.log
          METRO_LOG: ../rent-metro-e2e.log
        with:
          api-level: 34
          avd-name: Medium_Phone_API_34
          arch: x86_64
          cores: 4
          profile: pixel_7
          disable-animations: true
          script: cd mobile && npm run e2e:android

      - name: Upload Detox artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-detox-artifacts
          path: |
            mobile-detox-artifacts
            rent-metro-e2e.log
            rent-e2e-logcat.log
          if-no-files-found: ignore
