name: Production release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: write
  pull-requests: read
  security-events: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate immutable release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag, SHA, branches and pull requests
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          if [ "$(git cat-file -t "$RELEASE_TAG")" != tag ]; then
            echo "Release tags must be annotated." >&2
            exit 1
          fi

          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$RELEASE_SHA" != "$MAIN_SHA" ]; then
            echo "Tag SHA $RELEASE_SHA is not the current main SHA $MAIN_SHA." >&2
            exit 1
          fi

          OPEN_PRS="$(gh pr list --state open --limit 1 --json number --jq 'length')"
          if [ "$OPEN_PRS" != 0 ]; then
            echo "A production release requires zero open pull requests." >&2
            exit 1
          fi

          mapfile -t BRANCHES < <(gh api "repos/${GITHUB_REPOSITORY}/branches" --paginate --jq '.[].name')
          if [ "${#BRANCHES[@]}" -ne 1 ] || [ "${BRANCHES[0]}" != main ]; then
            printf 'A production release requires main as the only remote branch. Found: %s\n' "${BRANCHES[*]}" >&2
            exit 1
          fi

          CI_RUN_ID="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch=main \
              -f event=push \
              -f status=success \
              -f head_sha="$RELEASE_SHA" \
              -f per_page=1 \
              --jq '.workflow_runs[0].id // empty'
          )"
          if [ -z "$CI_RUN_ID" ]; then
            echo "No successful main CI run found for release SHA $RELEASE_SHA." >&2
            exit 1
          fi

          echo "Validated successful main CI run $CI_RUN_ID for $RELEASE_SHA."

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  build-server-artifact:
    name: Build immutable server artifact
    needs: preflight
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
    steps:
      - name: Checkout immutable release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            batch/package-lock.json
            frontend/package-lock.json
            mobile/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix batch
          npm ci --prefix frontend
          npm ci --prefix mobile

      - name: Build server applications once
        env:
          NEXT_PUBLIC_API_URL: /api
          API_PROXY_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_TURNSTILE_SITE_KEY"
          npm run build --prefix backend
          npm run build --prefix batch
          npm run build --prefix frontend

      - name: Retain production runtime dependencies
        run: |
          npm prune --omit=dev --package-lock=false --prefix backend
          # Terminus has not yet widened its Nest peer to v12; the production
          # graph is lockfile-tested, so do not re-resolve that stale peer.
          npm prune --omit=dev --legacy-peer-deps --package-lock=false --prefix batch

      - name: Package checksummed artifact and SBOMs
        run: scripts/build-release-artifact.sh

      - name: Upload immutable server artifact
        uses: actions/upload-artifact@v7
        with:
          name: rent-server-${{ needs.preflight.outputs.release_sha }}
          path: |
            artifacts/release/rent-server-${{ needs.preflight.outputs.release_sha }}.tar.gz
            artifacts/release/rent-server-${{ needs.preflight.outputs.release_sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  deploy-server:
    name: Deploy server
    needs: [preflight, build-server-artifact, deploy-android]
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - name: Checkout immutable release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pinned Ansible
        run: python -m pip install --disable-pip-version-check ansible-core==2.19.2

      - name: Download immutable server artifact
        uses: actions/download-artifact@v7
        with:
          name: rent-server-${{ needs.preflight.outputs.release_sha }}
          path: artifacts/release

      - name: Verify artifact checksum
        working-directory: artifacts/release
        run: sha256sum --check rent-server-${{ needs.preflight.outputs.release_sha }}.tar.gz.sha256

      - name: Configure SSH trust
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Materialize protected runtime environment
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_ENV_FILE"
          install -m 600 /dev/null /tmp/rent-production.env
          printf '%s\n' "$PRODUCTION_ENV_FILE" > /tmp/rent-production.env

      - name: Run Ansible playbook for exact SHA
        working-directory: ansible
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
        run: |
          artifact="../artifacts/release/rent-server-${RELEASE_SHA}.tar.gz"
          ansible-playbook -i inventory/production.yml deploy.yml \
            --private-key ~/.ssh/deploy_key \
            -e "ansible_host=${{ secrets.SSH_HOST }}" \
            -e "ansible_user=${{ secrets.SSH_USER }}" \
            -e "ansible_port=${{ secrets.SSH_PORT || 22 }}" \
            -e "git_sha=${RELEASE_SHA}" \
            -e "release_archive=${artifact}" \
            -e "runtime_env_file=/tmp/rent-production.env"

      - name: Remove materialized runtime environment
        if: always()
        run: rm -f /tmp/rent-production.env

  deploy-android:
    name: Deploy Android
    needs: preflight
    uses: ./.github/workflows/eas.yml
    secrets: inherit

  publish-release:
    name: Publish GitHub Release
    needs: [preflight, build-server-artifact, deploy-server, deploy-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download immutable server artifact
        uses: actions/download-artifact@v7
        with:
          name: rent-server-${{ needs.preflight.outputs.release_sha }}
          path: artifacts/release

      - name: Download immutable Android artifact
        uses: actions/download-artifact@v7
        with:
          name: rent-android-${{ needs.preflight.outputs.release_sha }}
          path: artifacts/release/android

      - name: Verify published artifact checksums
        run: |
          cd artifacts/release
          sha256sum --check rent-server-${{ needs.preflight.outputs.release_sha }}.tar.gz.sha256
          cd android
          sha256sum --check rent-android-${{ needs.preflight.outputs.release_sha }}.aab.sha256

      - name: Create immutable release record
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            "artifacts/release/rent-server-${RELEASE_SHA}.tar.gz" \
            "artifacts/release/rent-server-${RELEASE_SHA}.tar.gz.sha256" \
            "artifacts/release/android/rent-android-${RELEASE_SHA}.aab" \
            "artifacts/release/android/rent-android-${RELEASE_SHA}.aab.sha256" \
            artifacts/release/android/mobile.cdx.json \
            --notes "Deployed SHA: ${RELEASE_SHA}\nWorkflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
