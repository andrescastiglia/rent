groups:
  - name: rent-service-sli-recording
    interval: 30s
    rules:
      - record: rent:http_requests:rate5m
        expr: sum(rate(http_requests_total[5m]))

      - record: rent:http_errors:rate5m
        expr: sum(rate(http_requests_total{status_code=~"5.."}[5m]))

      - record: rent:http_availability:ratio5m
        expr: 1 - (rent:http_errors:rate5m / clamp_min(rent:http_requests:rate5m, 0.001))

      - record: rent:http_latency_p95:seconds5m
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))

      - record: rent:http_error_budget_burn:ratio5m
        expr: (rent:http_errors:rate5m / clamp_min(rent:http_requests:rate5m, 0.001)) / 0.001

      - record: rent:http_error_budget_burn:ratio1h
        expr: (sum(rate(http_requests_total{status_code=~"5.."}[1h])) / clamp_min(sum(rate(http_requests_total[1h])), 0.001)) / 0.001

  - name: rent-service-slo-alerts
    rules:
      - alert: RentApiFastErrorBudgetBurn
        expr: rent:http_error_budget_burn:ratio5m > 14.4 and rent:http_error_budget_burn:ratio1h > 14.4
        for: 5m
        labels:
          severity: critical
          slo: api-availability
        annotations:
          summary: API is rapidly consuming its 99.9% availability error budget
          runbook: docs/deployment/operations-slo.md#rentapifasterrorbudgetburn

      - alert: RentApiSlowErrorBudgetBurn
        expr: rent:http_error_budget_burn:ratio5m > 6 and rent:http_error_budget_burn:ratio1h > 6
        for: 30m
        labels:
          severity: warning
          slo: api-availability
        annotations:
          summary: API is consuming its availability error budget
          runbook: docs/deployment/operations-slo.md#rentapislowerrorbudgetburn

      - alert: RentApiHighP95Latency
        expr: rent:http_latency_p95:seconds5m > 2
        for: 10m
        labels:
          severity: warning
          slo: api-latency
        annotations:
          summary: API p95 latency has exceeded 2 seconds
          runbook: docs/deployment/operations-slo.md#rentapihighp95latency

      - alert: RentApiMetricsMissing
        expr: absent(http_requests_total)
        for: 10m
        labels:
          severity: critical
          slo: telemetry
        annotations:
          summary: Backend HTTP metrics are missing
          runbook: docs/deployment/operations-slo.md#rentapimetricsmissing

      - alert: RentBatchJobFailures
        expr: sum(increase(batch_job_runs_total{status="failed"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
          slo: batch-correctness
        annotations:
          summary: One or more batch jobs failed
          runbook: docs/deployment/operations-slo.md#rentbatchjobfailures
