---
- name: Deploy immutable Rent images to the existing oracle cluster
  hosts: all
  become: true
  gather_facts: false
  vars:
    root_path: /opt/rent-kubernetes/releases/{{ git_sha }}
  tasks:
    - name: Validate release inputs
      ansible.builtin.assert:
        that:
          - git_sha is match('^[0-9a-f]{40}$')
          - images_file is defined
          - runtime_env_file is defined
    - name: Install host backup and verification tools
      ansible.builtin.apt:
        name: [restic, python3-psycopg2, python3-yaml]
        state: present
        update_cache: false
    - name: Create isolated configuration directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - /etc/rent-kubernetes
        - /etc/rent-backup
    - name: Materialize protected backup credentials when supplied
      ansible.builtin.copy:
        src: '{{ backup_env_file }}'
        dest: /etc/rent-backup/r2.env
        mode: '0600'
      when: backup_env_file is defined
      no_log: true
    - name: Prepare the retained PostgreSQL directory
      ansible.builtin.file:
        path: /srv/k3s/rent/postgresql
        state: directory
        owner: '999'
        group: '999'
        mode: '0700'
    - name: Install reviewed deployment files
      ansible.builtin.copy:
        src: '../{{ item }}/'
        dest: '{{ root_path }}/{{ item }}/'
        owner: root
        group: root
        mode: preserve
      loop:
        - k8s
        - scripts/k8s
    - name: Install immutable image index
      ansible.builtin.copy:
        src: '{{ images_file }}'
        dest: '{{ root_path }}/images.json'
        mode: '0600'
    - name: Materialize protected runtime input
      ansible.builtin.copy:
        src: '{{ runtime_env_file }}'
        remote_src: '{{ runtime_env_remote | default(false) }}'
        dest: /etc/rent-kubernetes/runtime-source.env
        mode: '0600'
      no_log: true
    - name: Initialize the Rent namespace
      ansible.builtin.command:
        argv: [k3s, kubectl, apply, -f, '{{ root_path }}/k8s/base/namespace.yaml']
      changed_when: false
    - name: Reconcile application and database secrets
      ansible.builtin.command:
        argv: [python3, '{{ root_path }}/scripts/k8s/prepare-secrets.py', /etc/rent-kubernetes/runtime-source.env]
      no_log: true
      changed_when: false
    - name: Deploy and validate exact images
      ansible.builtin.command:
        argv: [bash, '{{ root_path }}/scripts/k8s/deploy.sh', '{{ root_path }}/images.json', '{{ git_sha }}', '{{ deploy_mode | default("release") }}']
      changed_when: true
    - name: Publish current deployment tools
      ansible.builtin.file:
        src: '{{ root_path }}'
        dest: /opt/rent-kubernetes/current
        state: link
        force: true

    - name: Install Rent observation and recovery units
      ansible.builtin.copy:
        src: 'files/{{ item }}'
        dest: '/etc/systemd/system/{{ item }}'
        mode: '0644'
      loop:
        - rent-infra-backup.service
        - rent-infra-backup.timer
        - rent-k8s-monitor.service
        - rent-k8s-monitor.timer
    - name: Enable Rent observation and recovery timers
      ansible.builtin.systemd_service:
        name: '{{ item }}'
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - rent-infra-backup.timer
        - rent-k8s-monitor.timer

    - name: Retrieve the actual deployed image references
      ansible.builtin.fetch:
        src: /etc/rent-kubernetes/images.json
        dest: '{{ deployed_images_file }}'
        flat: true
      when: deployed_images_file is defined and (deploy_mode | default('release')) == 'release'
