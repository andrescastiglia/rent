---
- name: Deploy immutable Real Estate Management System release
  hosts: all
  become: true
  become_user: deploy
  vars:
    deploy_sha: "{{ git_sha | mandatory }}"
    local_release_archive: "{{ release_archive | mandatory }}"
    local_runtime_env: "{{ runtime_env_file | mandatory }}"
    releases_path: "{{ deploy_path }}/releases"
    release_path: "{{ releases_path }}/server-{{ deploy_sha }}"
    legacy_release_path: "{{ releases_path }}/legacy-before-{{ deploy_sha }}"
    current_path: "{{ deploy_path }}/current"
    shared_path: "{{ deploy_path }}/shared"
    remote_release_archive: "/tmp/rent-server-{{ deploy_sha }}.tar.gz"
    force_migration_baseline_all_if_missing: "{{ migration_force_baseline_all_if_missing | default(false) | bool }}"

  tasks:
    - name: Validate immutable release inputs
      ansible.builtin.assert:
        that:
          - deploy_sha is match('^[0-9a-f]{40}$')
          - local_release_archive | length > 0
        fail_msg: A full Git SHA and a local immutable release archive are required.

    - name: Verify release archive exists on the controller
      ansible.builtin.stat:
        path: "{{ local_release_archive }}"
      delegate_to: localhost
      become: false
      register: controller_archive

    - name: Verify protected runtime environment exists on the controller
      ansible.builtin.stat:
        path: "{{ local_runtime_env }}"
      delegate_to: localhost
      become: false
      register: controller_runtime_env

    - name: Fail when the release archive is missing
      ansible.builtin.assert:
        that: controller_archive.stat.isreg | default(false)
        fail_msg: "Release archive not found: {{ local_release_archive }}"

    - name: Fail when the runtime environment is missing
      ansible.builtin.assert:
        that: controller_runtime_env.stat.isreg | default(false)
        fail_msg: Protected runtime environment not found.

    - name: Create deployment root
      ansible.builtin.file:
        path: "{{ deploy_path }}"
        state: directory
        mode: "0755"

    - name: Create private versioned deployment directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
      loop:
        - "{{ releases_path }}"
        - "{{ shared_path }}"

    - name: Inspect current release path before first adoption
      ansible.builtin.stat:
        path: "{{ current_path }}"
        follow: false
      register: initial_current

    - name: Preserve a legacy checkout as the first rollback target
      when:
        - initial_current.stat.exists | default(false)
        - not (initial_current.stat.islnk | default(false))
      block:
        - name: Verify legacy rollback target is unused
          ansible.builtin.stat:
            path: "{{ legacy_release_path }}"
          register: legacy_target

        - name: Refuse to overwrite an existing legacy rollback target
          ansible.builtin.assert:
            that: not (legacy_target.stat.exists | default(false))
            fail_msg: "Legacy rollback target already exists: {{ legacy_release_path }}"

        - name: Move legacy checkout into versioned releases
          ansible.builtin.command:
            cmd: mv "{{ current_path }}" "{{ legacy_release_path }}"
            removes: "{{ current_path }}"
            creates: "{{ legacy_release_path }}"

        - name: Keep legacy runtime paths valid through a rollback link
          ansible.builtin.file:
            src: "{{ legacy_release_path }}"
            dest: "{{ current_path }}"
            state: link

      rescue:
        - name: Inspect partially created current link
          ansible.builtin.stat:
            path: "{{ current_path }}"
            follow: false
          register: partial_current

        - name: Remove partial legacy rollback link
          ansible.builtin.file:
            path: "{{ current_path }}"
            state: absent
          when: partial_current.stat.islnk | default(false)

        - name: Inspect moved legacy checkout
          ansible.builtin.stat:
            path: "{{ legacy_release_path }}"
          register: moved_legacy

        - name: Restore legacy checkout directory
          ansible.builtin.command:
            cmd: mv "{{ legacy_release_path }}" "{{ current_path }}"
            removes: "{{ legacy_release_path }}"
            creates: "{{ current_path }}"
          when:
            - moved_legacy.stat.exists | default(false)
            - not (partial_current.stat.exists | default(false)) or (partial_current.stat.islnk | default(false))

        - name: Fail after restoring legacy checkout
          ansible.builtin.fail:
            msg: Legacy checkout adoption failed and was restored when possible.

    - name: Capture previous release link
      ansible.builtin.stat:
        path: "{{ current_path }}"
        follow: false
      register: previous_current

    - name: Refuse to overwrite a non-versioned current directory
      ansible.builtin.assert:
        that:
          - not (previous_current.stat.exists | default(false)) or (previous_current.stat.islnk | default(false))
        fail_msg: >-
          {{ current_path }} must be absent or a symlink after legacy adoption.

    - name: Snapshot current PM2 process list for rollback
      ansible.builtin.command:
        cmd: pm2 save
      changed_when: false
      when: previous_current.stat.islnk | default(false)

    - name: Upload exact server artifact
      ansible.builtin.copy:
        src: "{{ local_release_archive }}"
        dest: "{{ remote_release_archive }}"
        owner: deploy
        group: deploy
        mode: "0600"
      become_user: root

    - name: Unpack release without compiling on the server
      ansible.builtin.unarchive:
        src: "{{ remote_release_archive }}"
        dest: "{{ releases_path }}"
        remote_src: true
        creates: "{{ release_path }}/RELEASE_SHA"

    - name: Verify every released file checksum
      ansible.builtin.command:
        cmd: sha256sum --check SHA256SUMS
        chdir: "{{ release_path }}"
      changed_when: false

    - name: Read packaged release SHA
      ansible.builtin.command:
        cmd: cat RELEASE_SHA
        chdir: "{{ release_path }}"
      register: packaged_sha
      changed_when: false

    - name: Verify packaged release identity
      ansible.builtin.assert:
        that: packaged_sha.stdout == deploy_sha
        fail_msg: "Artifact contains {{ packaged_sha.stdout }}, expected {{ deploy_sha }}"

    - name: Apply protected runtime state and activate release
      block:
        - name: Update shared runtime environment from protected secret
          ansible.builtin.copy:
            src: "{{ local_runtime_env }}"
            dest: "{{ shared_path }}/.env"
            owner: deploy
            group: deploy
            mode: "0600"
            backup: true
          become_user: root
          register: runtime_env_update
          no_log: true

        - name: Link shared environment into runtime applications
          ansible.builtin.file:
            src: "{{ shared_path }}/.env"
            dest: "{{ item }}"
            state: link
            force: true
          loop:
            - "{{ release_path }}/backend/.env"
            - "{{ release_path }}/batch/.env"
            - "{{ release_path }}/frontend/.env"

        - name: Apply forward-compatible database migrations before activation
          ansible.builtin.command:
            cmd: >-
              ./migrations/run-migrations.sh{% if force_migration_baseline_all_if_missing %}
              --baseline-all-if-missing --force-baseline-all-if-missing{% endif %}
            chdir: "{{ release_path }}"
          environment:
            MIGRATIONS_ENV_FILE: "{{ shared_path }}/.env"

        - name: Mark runtime activation as started
          ansible.builtin.set_fact:
            runtime_activation_started: true

        - name: Point temporary link at the new release
          ansible.builtin.file:
            src: "{{ release_path }}"
            dest: "{{ deploy_path }}/current.next"
            state: link
            force: true

        - name: Atomically replace current release link
          ansible.builtin.command:
            cmd: mv -Tf "{{ deploy_path }}/current.next" "{{ current_path }}"

        - name: Start or reload the exact release
          ansible.builtin.command:
            cmd: pm2 startOrReload deploy/ecosystem.config.cjs --update-env
            chdir: "{{ current_path }}"
          environment:
            RENT_CURRENT_PATH: "{{ current_path }}"
            RENT_SHARED_ENV: "{{ shared_path }}/.env"
            RENT_WORKER_ID: "{{ inventory_hostname }}"
            FRONTEND_PORT: "{{ frontend_port }}"

        - name: Wait for backend readiness endpoint
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ backend_port }}/health"
            method: GET
            status_code: 200
          register: backend_health
          until: backend_health.status == 200
          retries: 20
          delay: 3

        - name: Wait for frontend readiness endpoint
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ frontend_port }}/health"
            method: GET
            status_code: 200
          register: frontend_health
          until: frontend_health.status == 200
          retries: 20
          delay: 3

      rescue:
        - name: Restore previous runtime environment after failed activation
          ansible.builtin.copy:
            src: "{{ runtime_env_update.backup_file }}"
            dest: "{{ shared_path }}/.env"
            remote_src: true
            mode: "0600"
          when:
            - runtime_env_update is defined
            - runtime_env_update.backup_file is defined
            - runtime_env_update.backup_file | length > 0
          no_log: true

        - name: Restore previous release link
          ansible.builtin.file:
            src: "{{ previous_current.stat.lnk_source }}"
            dest: "{{ current_path }}"
            state: link
            force: true
          when:
            - runtime_activation_started | default(false)
            - previous_current.stat.islnk | default(false)
            - previous_current.stat.lnk_source is defined

        - name: Remove failed release processes before PM2 rollback
          ansible.builtin.command:
            cmd: pm2 delete rent-backend rent-frontend rent-rag-worker
          register: remove_failed_release
          changed_when: remove_failed_release.rc == 0
          failed_when: false
          when:
            - runtime_activation_started | default(false)
            - previous_current.stat.islnk | default(false)

        - name: Restore snapshotted PM2 process list
          ansible.builtin.command:
            cmd: pm2 resurrect
          when:
            - runtime_activation_started | default(false)
            - previous_current.stat.islnk | default(false)

        - name: Remove failed first-release link
          ansible.builtin.file:
            path: "{{ current_path }}"
            state: absent
          when:
            - runtime_activation_started | default(false)
            - not (previous_current.stat.islnk | default(false))

        - name: Stop failed first-release processes
          ansible.builtin.command:
            cmd: pm2 delete rent-backend rent-frontend rent-rag-worker
          register: stop_failed_release
          changed_when: stop_failed_release.rc == 0
          failed_when: false
          when:
            - runtime_activation_started | default(false)
            - not (previous_current.stat.islnk | default(false))

        - name: Fail deployment after rollback
          ansible.builtin.fail:
            msg: Release deployment failed; protected environment, release link and PM2 state were restored when available.

    - name: Remove superseded runtime environment backup
      ansible.builtin.file:
        path: "{{ runtime_env_update.backup_file }}"
        state: absent
      when:
        - runtime_env_update is defined
        - runtime_env_update.backup_file is defined
        - runtime_env_update.backup_file | length > 0
      no_log: true

    - name: Schedule nightly RAG reconciliation from current release
      ansible.builtin.cron:
        name: Rent RAG nightly reconciliation
        minute: "30"
        hour: "2"
        job: >-
          cd {{ current_path }}/batch &&
          node dist/index.js rag-reconcile --entity all
          >> /var/log/rent/rag-reconcile.log 2>&1

    - name: Schedule weekly RAG audit retention from current release
      ansible.builtin.cron:
        name: Rent RAG weekly audit retention
        minute: "15"
        hour: "3"
        weekday: "0"
        job: >-
          cd {{ current_path }}/batch &&
          node dist/index.js rag-purge-audit
          >> /var/log/rent/rag-purge-audit.log 2>&1

    - name: Schedule communication retries from current release
      ansible.builtin.cron:
        name: Rent communication delivery retries
        minute: "*/5"
        job: >-
          cd {{ current_path }}/backend &&
          node -r dotenv/config dist/communications/retry-communications.cli.js
          >> /var/log/rent/communications-retry.log 2>&1

    - name: Save PM2 process list
      ansible.builtin.command:
        cmd: pm2 save

    - name: Remove transferred archive
      ansible.builtin.file:
        path: "{{ remote_release_archive }}"
        state: absent

    - name: Report activated immutable release
      ansible.builtin.debug:
        msg:
          - "Release {{ deploy_sha }} is active at {{ current_path }}"
          - "Rollback target: {{ previous_current.stat.lnk_source | default('none') }}"
