apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
replicas:
- name: backend
  count: 1
- name: frontend
  count: 1
- name: rag-worker
  count: 1
patches:
- target:
    kind: CronJob
  patch: "- op: replace\n  path: /spec/suspend\n  value: false\n"
- target:
    kind: CronJob
    name: billing|sync-indices|process-settlements
  patch: "- op: replace\n  path: /spec/suspend\n  value: true\n"
- target:
    kind: ConfigMap
    name: rent-runtime
  patch: "- op: add\n  path: /data/AI_RAG_REASONING_EFFORT\n  value: none\n"
