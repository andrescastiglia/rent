metadata:
  name: restore-drill
spec:
  schedule: 15 4 15 * *
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: restore-drill
            database-client: 'true'
            app.kubernetes.io/part-of: rent
        spec:
          serviceAccountName: runtime
          automountServiceAccountToken: false
          imagePullSecrets:
          - name: ghcr-pull
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: restore-drill
            image: ghcr.io/andrescastiglia/rent-maintenance:bootstrap
            command:
            - bash
            - /app/scripts/restore-drill.sh
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            envFrom:
            - secretRef:
                name: rent-backup-env
            - secretRef:
                name: postgres-maintenance
            env:
            - name: PGHOST
              value: postgres.rent.svc.cluster.local
            - name: PGDATABASE
              value: rent_db
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /run/postgres/ca.crt
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ca
              mountPath: /run/postgres
              readOnly: true
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 2Gi
          - name: ca
            secret:
              secretName: postgres-ca
              defaultMode: 288
