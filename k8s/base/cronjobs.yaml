apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-indices
spec:
  schedule: 0 6 * * *
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: rent
            app: sync-indices
            database-client: 'true'
        spec:
          serviceAccountName: runtime
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
          - name: ghcr-pull
          containers:
          - name: batch
            image: ghcr.io/andrescastiglia/rent-batch:bootstrap
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            envFrom:
            - configMapRef:
                name: rent-runtime
            env:
            - name: NEW_RELIC_APP_NAME
              value: RENT-Batch-production
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            volumeMounts:
            - name: runtime
              mountPath: /run/rent
              readOnly: true
            - name: ca
              mountPath: /run/postgres
              readOnly: true
            - name: tmp
              mountPath: /tmp
            args:
            - /app/deploy/run-exclusive.cjs
            - sync-indices
            - dist/index.js
            - sync-indices
          volumes:
          - name: runtime
            secret:
              secretName: rent-batch-runtime
              defaultMode: 288
          - name: ca
            secret:
              secretName: postgres-ca
              defaultMode: 288
          - name: tmp
            emptyDir:
              sizeLimit: 512Mi
          restartPolicy: Never
          terminationGracePeriodSeconds: 120
---
