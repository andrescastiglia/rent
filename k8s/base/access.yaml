apiVersion: v1
kind: ServiceAccount
metadata:
  name: runtime
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
rules:
- apiGroups:
  - ''
  - apps
  - batch
  - networking.k8s.io
  resources:
  - configmaps
  - secrets
  - services
  - deployments
  - deployments/scale
  - statefulsets
  - cronjobs
  - jobs
  - pods
  - pods/log
  - pods/exec
  - events
  - persistentvolumeclaims
  - networkpolicies
  - resourcequotas
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
subjects:
- kind: ServiceAccount
  name: deployer
  namespace: rent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-isolation
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          database-client: 'true'
    ports:
    - protocol: TCP
      port: 5432
